name: Publish Pre-release to PyPI

# 触发条件：
# 1. 推送符合预发布模式的标签（如 v1.4.0-alpha.1, v1.4.0-beta.2, v1.4.0-rc.1）
# 2. 手动触发（workflow_dispatch）
on:
  push:
    tags:
      - 'v*-alpha.*'
      - 'v*-beta.*'
      - 'v*-rc.*'
      - 'v*.dev*'
      - 'v*-pre.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Pre-release version (e.g., 1.4.0-alpha.1)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set pre-release version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            # 手动触发：使用用户输入的版本号
            VERSION="${{ github.event.inputs.version }}"
          else
            # 标签触发：从 git tag 中提取版本号（去掉 v 前缀）
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Pre-release version: $VERSION"

      - name: Update version in pyproject.toml
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
          echo "Updated pyproject.toml version to $VERSION"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish pre-release to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
